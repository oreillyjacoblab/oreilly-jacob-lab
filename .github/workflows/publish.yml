name: Validate and Build Website

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "templates/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "content/**"
      - "templates/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate CV data
        run: npm run validate

      - name: Build website and PDF CV
        run: npm run build

      - name: Run tests
        run: npm test

# Generated files (index.html, resources.html, professor-cv.pdf) are produced
# here for validation only and are not committed back to the repository, to
# avoid triggering another workflow run. Vercel runs `npm run build` again at
# deploy time (see vercel.json) so the live site always serves fresh output.
