media:
  input: assets/images
  output: /assets/images

content:
  - name: cv
    label: CV
    type: file
    path: content/cv.json
    format: json
    fields:
      - name: profile
        label: Profile
        type: object
        fields:
          - { name: name, label: Full Name, type: string }
          - { name: title, label: Academic Title, type: string }
          - { name: institution, label: Institution, type: string }
          - { name: email, label: Email, type: string }
          - { name: phone, label: Phone, type: string, required: false }
          - { name: office, label: Office Location, type: string }
          - { name: website, label: Personal Website, type: string, required: false }
          - { name: photo, label: Photo, type: image, required: false }
          - { name: bio, label: Biography, type: text, description: "Shown on the About section of the website." }

      - name: education
        label: Education
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{degree}"
        fields:
          - { name: id, label: ID, type: uuid, options: { editable: false, generate: false } }
          - { name: degree, label: Degree, type: string }
          - { name: institution, label: Institution, type: string }
          - { name: year, label: Year, type: string }
          - { name: details, label: Notes, type: text, required: false }
          - { name: hidden, label: Hide This Entry, type: boolean, default: false }
          - { name: sortOrder, label: Sort Order, type: number, default: 100 }

      - name: appointments
        label: Academic Appointments
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: id, label: ID, type: uuid, options: { editable: false, generate: false } }
          - { name: title, label: Title, type: string }
          - { name: institution, label: Institution, type: string }
          - { name: startYear, label: Start Year, type: string }
          - { name: endYear, label: End Year (or "Present"), type: string }
          - { name: details, label: Notes, type: text, required: false }
          - { name: hidden, label: Hide This Entry, type: boolean, default: false }
          - { name: sortOrder, label: Sort Order, type: number, default: 100 }

      - name: books
        label: Books
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: id, label: ID, type: uuid, options: { editable: false, generate: false } }
          - { name: title, label: Title, type: string }
          - { name: authors, label: Authors, type: string }
          - { name: publisher, label: Publisher, type: string, required: false }
          - { name: year, label: Year, type: string, required: false }
          - { name: url, label: Web Link, type: string, required: false }
          - { name: status, label: Publication Status, type: select, options: ["Published", "Forthcoming", "In Press", "Accepted", "Under Review", "In Preparation", "Working Paper"] }
          - { name: featured, label: Featured Item, type: boolean, default: false }
          - { name: hidden, label: Hide This Entry, type: boolean, default: false }
          - { name: sortOrder, label: Sort Order, type: number, default: 100 }

      - name: chapters
        label: Book Chapters
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: id, label: ID, type: uuid, options: { editable: false, generate: false } }
          - { name: title, label: Chapter Title, type: string }
          - { name: authors, label: Authors, type: string }
          - { name: journal, label: Book Title, type: string }
          - { name: pages, label: Page Range, type: string, required: false }
          - { name: year, label: Year, type: string, required: false }
          - { name: url, label: Web Link, type: string, required: false }
          - { name: status, label: Publication Status, type: select, options: ["Published", "Forthcoming", "In Press", "Accepted", "Under Review", "In Preparation", "Working Paper"] }
          - { name: featured, label: Featured Item, type: boolean, default: false }
          - { name: hidden, label: Hide This Entry, type: boolean, default: false }
          - { name: sortOrder, label: Sort Order, type: number, default: 100 }

      - name: publications
        label: Journal Articles
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields:
          - { name: id, label: ID, type: uuid, options: { editable: false, generate: false } }
          - name: text
            label: Publication Details
            type: text
            description: >-
              Type five lines: Year, Title, Authors, Journal, then any
              additional notes (volume, pages, etc. — optional).
          - { name: doi, label: DOI, type: string, required: false }
          - { name: url, label: Web Link, type: string, required: false }
          - { name: status, label: Publication Status, type: select, options: ["Published", "Forthcoming", "In Press", "Accepted", "Under Review", "In Preparation", "Working Paper"] }
          - { name: featured, label: Featured Item, type: boolean, default: false }
          - { name: hidden, label: Hide This Entry, type: boolean, default: false }
          - { name: sortOrder, label: Sort Order, type: number, default: 100 }

      - name: presentations
        label: Presentations
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: id, label: ID, type: uuid, options: { editable: false, generate: false } }
          - { name: title, label: Title, type: string }
          - { name: event, label: Event Name, type: string }
          - { name: location, label: Location, type: string, required: false }
          - { name: year, label: Year, type: string, required: false }
          - { name: details, label: Notes, type: text, required: false }
          - { name: hidden, label: Hide This Entry, type: boolean, default: false }
          - { name: sortOrder, label: Sort Order, type: number, default: 100 }

      - name: grants
        label: Grants
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: id, label: ID, type: uuid, options: { editable: false, generate: false } }
          - { name: title, label: Title, type: string }
          - { name: organization, label: Funding Organization, type: string, required: false }
          - { name: year, label: Year, type: string, required: false }
          - { name: details, label: Notes, type: text, required: false }
          - { name: hidden, label: Hide This Entry, type: boolean, default: false }
          - { name: sortOrder, label: Sort Order, type: number, default: 100 }

      - name: awards
        label: Awards
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: id, label: ID, type: uuid, options: { editable: false, generate: false } }
          - { name: title, label: Title, type: string }
          - { name: organization, label: Awarding Organization, type: string, required: false }
          - { name: year, label: Year, type: string, required: false }
          - { name: details, label: Notes, type: text, required: false }
          - { name: hidden, label: Hide This Entry, type: boolean, default: false }
          - { name: sortOrder, label: Sort Order, type: number, default: 100 }

      - name: teaching
        label: Teaching
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{course}"
        fields:
          - { name: id, label: ID, type: uuid, options: { editable: false, generate: false } }
          - { name: course, label: Course Title, type: string }
          - { name: institution, label: Institution, type: string }
          - { name: years, label: Years Taught, type: string, required: false }
          - { name: details, label: Notes, type: text, required: false }
          - { name: hidden, label: Hide This Entry, type: boolean, default: false }
          - { name: sortOrder, label: Sort Order, type: number, default: 100 }

      - name: service
        label: Professional Service
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: id, label: ID, type: uuid, options: { editable: false, generate: false } }
          - { name: title, label: Role or Activity, type: string }
          - { name: organization, label: Organization, type: string, required: false }
          - { name: year, label: Year, type: string, required: false }
          - { name: details, label: Notes, type: text, required: false }
          - { name: hidden, label: Hide This Entry, type: boolean, default: false }
          - { name: sortOrder, label: Sort Order, type: number, default: 100 }

      - name: media
        label: Media
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: id, label: ID, type: uuid, options: { editable: false, generate: false } }
          - { name: title, label: Title, type: string }
          - { name: organization, label: Outlet, type: string, required: false }
          - { name: year, label: Year, type: string, required: false }
          - { name: url, label: Web Link, type: string, required: false }
          - { name: hidden, label: Hide This Entry, type: boolean, default: false }
          - { name: sortOrder, label: Sort Order, type: number, default: 100 }

      - name: other
        label: Additional Information
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: id, label: ID, type: uuid, options: { editable: false, generate: false } }
          - { name: title, label: Title, type: string }
          - { name: details, label: Notes, type: text, required: false }
          - { name: hidden, label: Hide This Entry, type: boolean, default: false }
          - { name: sortOrder, label: Sort Order, type: number, default: 100 }

  - name: site
    label: Site Settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: site
        label: Site
        type: object
        fields:
          - { name: name, label: Website Name, type: string }
          - { name: footerNote, label: Footer Text, type: string }

      - name: hero
        label: Homepage Introduction
        type: object
        description: "The large text at the top of the homepage."
        fields:
          - { name: eyebrow, label: Small Label Above the Headline, type: string }
          - { name: title, label: Headline, type: string }
          - { name: mission, label: Description, type: text }

      - name: researchTopics
        label: Research Topics
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        description: "The three expandable research topic tiles on the homepage."
        fields:
          - { name: id, label: ID, type: uuid, options: { editable: false, generate: false } }
          - { name: icon, label: Icon, type: select, options: [{ label: "Circle", value: circle }, { label: "Trend Line", value: trend }, { label: "Cluster of Dots", value: cluster }] }
          - { name: label, label: Small Category Label, type: string }
          - { name: question, label: Question (shown on the tile), type: string }
          - { name: blurb, label: Description (shown when expanded), type: text }
          - name: publicationIds
            label: Featured Publication IDs
            type: string
            list: true
            description: "Paste the ID of each Journal Article/Book/Chapter to show here when this tile is expanded. Find an entry's ID at the top of its editing form."

  - name: resources
    label: Resources
    type: file
    path: content/resources.json
    format: json
    fields:
      - name: resources
        label: Downloadable Documents
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: id, label: ID, type: uuid, options: { editable: false, generate: false } }
          - { name: title, label: Title, type: string }
          - { name: description, label: Short Description, type: text }
          - name: file
            label: Document
            type: file
            media:
              input: assets/files/resources
              output: /assets/files/resources
          - { name: hidden, label: Hide This Item, type: boolean, default: false }
          - { name: sortOrder, label: Sort Order, type: number, default: 100 }
